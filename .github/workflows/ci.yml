name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # Fail fast instead of hanging for hours on a stuck runner/mirror.
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # azure.archive.ubuntu.com intermittently stalls mid-update; retry once
      # and cap fetch timeouts so a bad mirror fails fast instead of hanging.
      - name: Install ImageMagick
        run: |
          sudo apt-get update -o Acquire::Retries=5 -o Acquire::http::Timeout=30 \
            || sudo apt-get update -o Acquire::Retries=5 -o Acquire::http::Timeout=30
          sudo apt-get install -y -o Acquire::Retries=5 imagemagick

      - name: Verify version sync
        run: npm run verify:version

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run unit and e2e tests
        run: npm run test:ci

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          if-no-files-found: ignore
